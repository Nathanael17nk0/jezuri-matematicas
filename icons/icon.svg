<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer glowing card -->
  <rect x="76" y="76" width="360" height="360" rx="48" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="6"/>
  
  <!-- Divider grid lines -->
  <line x1="100" y1="256" x2="412" y2="256" stroke="#6366f1" stroke-width="5" stroke-linecap="round"/>
  <line x1="256" y1="100" x2="256" y2="412" stroke="#6366f1" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Division (÷) Top-Left -->
  <circle cx="180" cy="154" r="10" fill="#38bdf8"/>
  <rect x="148" y="178" width="64" height="12" rx="6" fill="#38bdf8"/>
  <circle cx="180" cy="214" r="10" fill="#38bdf8"/>
  
  <!-- Algebra X (x) Top-Right -->
  <line x1="306" y1="156" x2="362" y2="212" stroke="#a78bfa" stroke-width="12" stroke-linecap="round"/>
  <line x1="362" y1="156" x2="306" y2="212" stroke="#a78bfa" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Plus (+) Bottom-Left -->
  <line x1="180" y1="300" x2="180" y2="356" stroke="#f59e0b" stroke-width="12" stroke-linecap="round"/>
  <line x1="152" y1="328" x2="208" y2="328" stroke="#f59e0b" stroke-width="12" stroke-linecap="round"/>
  
  <!-- Equal (=) Bottom-Right -->
  <rect x="306" y="312" width="56" height="10" rx="5" fill="#10b981"/>
  <rect x="306" y="334" width="56" height="10" rx="5" fill="#10b981"/>
</svg>
